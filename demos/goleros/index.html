<style>:root {
  --ink: #1A1217;
  --accent: #E4F062;
  --bg: #F4F3EE;
  --card: #FFFFFF;
  --muted: #6E6A6C;
  --line: #E7E5DF;
  --soft: #F7F6F2;
  --danger: #C2352B;
  --radius: 18px;
  font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); -webkit-font-smoothing: antialiased; }
body.embed { background: transparent; }
button { font: inherit; color: inherit; }
input, textarea, select { font: inherit; color: var(--ink); }

.wrap { max-width: 580px; margin: 0 auto; padding: 28px 16px 48px; }
body.embed .wrap { padding: 8px 4px 16px; }

/* Encabezado del negocio */
.head { display: flex; gap: 14px; align-items: center; margin-bottom: 22px; }
.mark { width: 52px; height: 52px; border-radius: 16px; background: var(--ink); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 20px; flex: none; }
.head h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
body.embed .head { display: none; }

.card { background: var(--card); border-radius: 24px; padding: 22px; box-shadow: 0 1px 0 rgba(0,0,0,.03), 0 18px 50px -24px rgba(26,18,23,.18); }

/* Pasos */
.steps { display: flex; gap: 6px; margin-bottom: 20px; }
.step { flex: 1; }
.step .bar { height: 4px; border-radius: 4px; background: var(--line); transition: background .3s; }
.step.on .bar { background: var(--ink); }
.step span { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 600; }
.step.on span { color: var(--ink); }

h2 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }

/* Servicios */
.services { display: grid; gap: 10px; }
.svc { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 16px 18px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; transition: border-color .15s, transform .15s, background .15s; }
.svc:hover { border-color: var(--ink); transform: translateY(-1px); }
.svc strong { font-size: 16px; }
.svc .price { font-weight: 800; }
.svc .meta { color: var(--muted); font-size: 13px; grid-column: 1 / -1; }
.svc .dur { display: inline-block; background: var(--soft); border-radius: 999px; padding: 2px 9px; font-weight: 700; color: var(--ink); margin-right: 6px; font-size: 12px; }

/* Resumen elegido */
.chosen { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--soft); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; font-size: 14px; }
.chosen b { display: block; }
.chosen small { color: var(--muted); }
.link { background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; font-weight: 700; font-size: 13px; }

/* Días */
.days { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
.day { flex: none; width: 64px; border: 1.5px solid var(--line); background: var(--card); border-radius: 16px; padding: 10px 0; text-align: center; cursor: pointer; scroll-snap-align: start; transition: all .15s; }
.day small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.day b { display: block; font-size: 22px; margin: 2px 0; }
.day em { font-style: normal; font-size: 11px; color: var(--muted); }
.day:hover { border-color: var(--ink); }
.day.sel { background: var(--ink); border-color: var(--ink); color: #fff; }
.day.sel small, .day.sel em { color: rgba(255,255,255,.7); }

/* Horas */
.slot-group { margin-top: 16px; }
.slot-group h3 { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.slot { border: 1.5px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 0; font-weight: 700; cursor: pointer; transition: all .15s; }
.slot:hover { border-color: var(--ink); background: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 26px 10px; background: var(--soft); border-radius: 14px; font-size: 14px; margin-top: 14px; }
.loading { text-align: center; color: var(--muted); padding: 26px; font-size: 14px; }

/* Formulario */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.field label span { color: var(--muted); font-weight: 500; }
.field input, .field textarea, .field select { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 16px; background: #fff; outline: none; transition: border-color .15s; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--ink); }
.field textarea { resize: vertical; min-height: 70px; }
.hp { position: absolute; left: -9999px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .row2 { grid-template-columns: 1fr; } }

.btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; border: 0; background: var(--accent); color: var(--ink); font-weight: 800; font-size: 16px; padding: 15px 22px; border-radius: 999px; cursor: pointer; width: 100%; transition: transform .15s, box-shadow .15s; text-decoration: none; }
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px -10px rgba(26,18,23,.5); }
.btn:disabled { opacity: .5; cursor: wait; transform: none; }
.btn.dark { background: var(--ink); color: #fff; }
.btn.ghost { background: var(--soft); }
.btn.small { width: auto; padding: 9px 14px; font-size: 14px; }
.error { background: #FCEDEB; color: var(--danger); border-radius: 12px; padding: 11px 14px; font-size: 14px; margin-bottom: 12px; font-weight: 600; }
.fine { color: var(--muted); font-size: 12px; text-align: center; margin: 12px 0 0; }

/* Listo */
.done { text-align: center; padding: 8px 0; }
.done .icon { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; margin: 0 auto 14px; font-size: 28px; }
.done p { color: var(--muted); line-height: 1.5; }
.summary { text-align: left; background: var(--soft); border-radius: 14px; padding: 14px 16px; margin: 16px 0; line-height: 1.6; font-size: 15px; }

/* Correo simulado (solo demo) */
.mail { text-align: left; border: 1.5px dashed #C9C5BB; border-radius: 16px; overflow: hidden; margin-top: 18px; }
.mail .bar { background: var(--soft); padding: 10px 14px; font-size: 12px; color: var(--muted); }
.mail .bar b { color: var(--ink); }
.mail .body { padding: 16px; }
.mail .top { background: var(--ink); color: #fff; font-weight: 800; padding: 12px 16px; border-radius: 10px 10px 0 0; margin: -4px -4px 12px; font-size: 14px; }

.demo-banner { background: var(--ink); color: #fff; font-size: 13px; padding: 10px 16px; text-align: center; }
.demo-banner a { color: var(--accent); font-weight: 700; }
.foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
.foot a { color: var(--muted); }

/* Estrellas de la reseña (demo) */
.rstars { display: flex; gap: 6px; }
.rs { border: 0; background: none; font-size: 38px; line-height: 1; color: #DDD9D2; cursor: pointer; padding: 0 2px; }
.rs.on { color: var(--ink); }
.rs:focus-visible { outline: 2px solid var(--ink); border-radius: 6px; }

/* Foto del negocio en el encabezado */
.mark.photo { padding: 0; overflow: hidden; background: var(--accent); }
.mark.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Redes sociales */
.socials { display: flex; flex-wrap: wrap; gap: 8px; margin: -8px 0 20px; }
.socials:empty { display: none; }
.soc { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; background: var(--card); border: 1.5px solid var(--line); color: var(--ink); text-decoration: none; font-weight: 700; font-size: 13px; transition: border-color .15s; }
.soc:hover { border-color: var(--ink); }
body.embed .socials { display: none; }
.bio { margin: 0 0 16px; font-size: 14px; line-height: 1.5; color: var(--muted); }

/* Acceso al panel */
.authc { max-width: 400px; margin: 40px auto; }
.authc .fine a, .fine a { color: var(--ink); font-weight: 600; }
.okmsg { background: #EEF7EC; color: #24572B; border-radius: 12px; padding: 11px 14px; font-size: 14px; margin-bottom: 12px; line-height: 1.45; }
.pwrow { position: relative; }
.pwrow input { padding-right: 76px; width: 100%; }
.pwshow { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--ink);
  font: 600 13px/1 inherit; font-family: inherit; padding: 8px 10px; border-radius: 8px; cursor: pointer; opacity: .75; }
.pwshow:hover { opacity: 1; background: rgba(0,0,0,.04); }

.head .mark{width:78px;height:78px;border-radius:24px;font-size:26px}.head p{margin-top:4px}
.svc.hasimg{grid-template-columns:72px 1fr auto;column-gap:14px}.svc .svcimg{grid-row:1/span 2;width:72px;height:72px;border-radius:14px;object-fit:cover;align-self:center;background:var(--accent)}.svc.hasimg .meta{grid-column:2/-1}

.galeria{margin:0 0 20px}.galeria h2{font-size:15px;margin:0 0 10px;letter-spacing:.01em}
.gfotos{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.gfotos::-webkit-scrollbar{display:none}
.gph{flex:none;width:128px;aspect-ratio:9/14;padding:0;border:0;border-radius:18px;overflow:hidden;background:var(--accent);cursor:zoom-in;scroll-snap-align:start;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.gph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}.gph:hover img{transform:scale(1.04)}
.gcred{font-size:12.5px;opacity:.65;margin:8px 0 0}
.gbox{position:fixed;inset:0;z-index:50;background:rgba(10,20,15,.86);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.gbox img{max-width:100%;max-height:100%;border-radius:16px}
@media (min-width:1000px){
 .wrap{max-width:1000px;display:grid;grid-template-columns:330px minmax(0,580px);column-gap:40px;justify-content:center;align-items:start}
 .wrap>*{grid-column:2}
 .wrap>.galeria{grid-column:1;grid-row:1/span 6;position:sticky;top:24px;margin:0}
 .galeria h2{font-size:17px}
 .gfotos{display:grid;grid-template-columns:1fr 1fr;overflow:visible;margin:0;padding:0}
 .gph{width:auto}
}

  .av { width: 42px; height: 42px; border-radius: 50%; background: var(--ink); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 14px; }
  .clrow b { display: block; font-size: 15px; }
  .clrow span { display: block; color: var(--muted); font-size: 12.5px; }
  .nextchip { font-size: 12px; font-weight: 700; background: var(--accent); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  .nochip { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .cldet { padding: 0 4px 14px 58px; }
  .hist { font-size: 13px; padding: 6px 0; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; gap: 10px; }
  .hist:first-child { border-top: 0; }
  .hist .st { color: var(--muted); }
  .cact { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .detail p { margin: 0 0 6px; font-size: 15px; }
  .srv { border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 14px 14px; margin-bottom: 10px; background: #fff; }
  .srv.off { background: var(--soft); }
  .srv.off .srvgrid, .srv.off textarea { opacity: .55; }
  .srvtop { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .srvnum { width: 26px; height: 26px; border-radius: 8px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
  .x:disabled { opacity: .3; cursor: default; }
  .srvgrid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 10px; }
  .withunit { display: flex; align-items: center; gap: 6px; }
  .withunit span { color: var(--muted); font-size: 14px; }
  .psec { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 10px; }
  @media (max-width: 560px) { .srvgrid { grid-template-columns: 1fr 1fr; } .srvgrid .field:first-child { grid-column: 1 / -1; } }
  .rvsum { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; background: var(--soft); border-radius: 16px; padding: 18px 20px; margin-bottom: 8px; }
  .rvavg { font-size: 44px; font-weight: 800; line-height: 1; }
  .rvstars { color: var(--ink); letter-spacing: 2px; font-size: 15px; }
  .rvbars { display: grid; gap: 6px; }
  .rvbar { display: grid; grid-template-columns: 36px 1fr 28px; gap: 10px; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
  .rvbar i { height: 8px; border-radius: 99px; background: #fff; overflow: hidden; display: block; }
  .rvbar em { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
  .rv { border-top: 1px solid var(--line); padding: 14px 2px; }
  .rv .rvhead { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .rvmeta { color: var(--muted); font-size: 12px; }
  .rv p { margin: 8px 0 0; font-size: 14px; line-height: 1.5; }
  .detail .k { color: var(--muted); font-size: 13px; }
  @media (max-width: 560px) { .wkhead b { font-size: 16px; min-width: 0; } .cldet { padding-left: 4px; } .clrow { grid-template-columns: 42px 1fr; } .clrow .nextchip, .clrow .nochip { grid-column: 2; justify-self: start; } }
</style>
